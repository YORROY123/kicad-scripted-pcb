name: schematic

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version
          # A KiCad that has never opened its GUI has no global library tables, and ERC then warns
          # that every symbol and footprint library is missing. Use the tables KiCad ships.
          mkdir -p ~/.config/kicad/10.0
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table ~/.config/kicad/10.0/

      - name: ERC, netlist check, design review, mutation tests, reproducibility
        run: bash tools/ci-schematic.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Placement, freerouting, DRC, fab outputs
        run: bash tools/ci-pcb.sh

      - name: Compare boards with the committed ones
        run: git diff --stat -- 'boards/*/*.kicad_pcb' 'boards/*/*.kicad_pro'

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boards-${{ github.sha }}
          path: |
            boards/*/*.dsn
            boards/*/*.ses
            boards/*/*.kicad_pcb
            boards/*/drc.rpt
            boards/*/freerouting.log
            boards/*/fab/
          retention-days: 14
