name: schematic

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version
          # A KiCad that has never opened its GUI has no global library tables, and ERC then warns
          # that every symbol and footprint library is missing. Use the tables KiCad ships.
          mkdir -p ~/.config/kicad/10.0
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table ~/.config/kicad/10.0/

      - name: ERC, netlist check, design review, mutation tests, reproducibility
        run: bash tools/ci-schematic.sh
